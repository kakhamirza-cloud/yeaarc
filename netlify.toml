[build]
  command = "npm run build"
  publish = "dist"

# Redirect www to apex
[[redirects]]
  from = "https://www.arcmfers.xyz/*"
  to   = "https://arcmfers.xyz/:splat"
  status = 301
  force  = true

# Clean /mint URL
[[redirects]]
  from = "/mint"
  to = "/mint.html"
  status = 200

[[redirects]]
  from = "/mint/"
  to = "/mint.html"
  status = 200

# Ladder climb mini-game
[[redirects]]
  from = "/game"
  to = "/game.html"
  status = 200

[[redirects]]
  from = "/game/"
  to = "/game.html"
  status = 200

[[redirects]]
  from = "/checker"
  to = "/checker.html"
  status = 200

[[redirects]]
  from = "/checker/"
  to = "/checker.html"
  status = 200

[[redirects]]
  from = "/prediction"
  to = "/prediction.html"
  status = 200

[[redirects]]
  from = "/prediction/"
  to = "/prediction.html"
  status = 200

[[redirects]]
  from = "/apply"
  to = "/apply.html"
  status = 200

[[redirects]]
  from = "/apply/"
  to = "/apply.html"
  status = 200

[[redirects]]
  from = "/apply-admin"
  to = "/apply-admin.html"
  status = 200

[[redirects]]
  from = "/apply-admin/"
  to = "/apply-admin.html"
  status = 200

# Gallery samples
[[redirects]]
  from = "/gallery/*"
  to = "/gallery/:splat"
  status = 200

# Art and other static files should not fall through to index
[[redirects]]
  from = "/art/*"
  to = "/art/:splat"
  status = 200

# SPA fallback for home
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/gallery/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/art/*"
  [headers.values]
    Cache-Control = "public, max-age=60"
