[build]
  command = "npm run build"
  publish = "dist"

# Redirect www to apex
[[redirects]]
  from = "https://www.arcmfers.xyz/*"
  to   = "https://arcmfers.xyz/:splat"
  status = 301
  force  = true

# Clean /mint URL
[[redirects]]
  from = "/mint"
  to = "/mint.html"
  status = 200

[[redirects]]
  from = "/mint/"
  to = "/mint.html"
  status = 200

# Art and other static files should not fall through to index
[[redirects]]
  from = "/art/*"
  to = "/art/:splat"
  status = 200

# SPA fallback for home
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/art/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
