<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARC mfers — mint</title>
    <meta
      name="description"
      content="Connect your wallet for ARC mfers. Mint opens soon."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true">
      <div class="wash"></div>
      <div class="grain"></div>
    </div>

    <header class="nav">
      <a class="brand" href="/">arc<span>_mfers</span></a>
      <div class="nav-right">
        <a href="/">home</a>
        <a href="/mint" aria-current="page">mint</a>
        <button type="button" class="wallet-btn" id="connectBtn">
          <span id="connectLabel">connect</span>
        </button>
      </div>
    </header>

    <main class="mint-page">
      <p class="kicker">mint · arc chain</p>
      <h1 class="mint-page-title">connect early</h1>
      <p class="mint-page-copy">
        The Arc Mfers smart contract has not been deployed yet. Please connect your
        wallet and follow our social channels to receive updates when minting becomes
        available.
      </p>

      <div class="mint-card">
        <div class="mint-card-supply">
          <span class="mint-card-label">minted</span>
          <strong id="mintedDisplay">— / 5,000</strong>
        </div>

        <button type="button" class="btn primary mint-cta" id="pageConnectBtn">
          Connect Wallet
        </button>

        <a
          class="btn notify mint-follow"
          href="https://x.com/Arc_Mfers"
          target="_blank"
          rel="noopener noreferrer"
        >
          Follow @arc_mfers
        </a>

        <p class="mint-status" id="mintStatus" role="status"></p>
      </div>

      <p class="mint-page-note">
        <a href="https://x.com/Arc_Mfers/status/2078030155121901985?s=20" target="_blank" rel="noopener noreferrer">
          Retweet the drop →
        </a>
      </p>
    </main>

    <footer class="footer">
      <img src="/art/420.png?v=3" alt="" width="28" height="28" />
      <span>ARC mfers · Arc Chain</span>
    </footer>

    <script type="module" src="/src/mint-page.js"></script>
  </body>
</html>
